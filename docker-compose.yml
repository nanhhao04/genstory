version: '3.8'

services:
  backend:
    build: .
    container_name: genstory_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://genstory:password@db:5432/genstory_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000


  db:
    image: postgres:15-alpine
    container_name: genstory_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genstory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-genstory_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  adminer:
    image: adminer:latest
    container_name: genstory_adminer
    ports:
      - "8081:8080"
    depends_on:
      - db


  redis:
    image: redis:7-alpine
    container_name: genstory_redis
    ports:
      - "6379:6379"

  test:
    build: .
    container_name: genstory_test
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://genstory:password@db:5432/genstory_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: pytest src/tests

volumes:
  postgres_data:
