[project]
name = "genstory"
version = "0.1.0"
description = "GenStory FastAPI Application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "gradio",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "pyyaml",
    "jinja2",
    "aiofiles",
    "google-genai",
    "openai",
    "langgraph",
    "huggingface_hub",
    "Pillow",
    "sqlalchemy",
    "asyncpg",
    "arq",
    "redis",
    "fpdf2",
    "fonttools",
    "requests",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "prometheus-fastapi-instrumentator",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
    "self-learn",
    "docs",
    "grafana",
    "prometheus",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # function call in argument defaults (FastAPI Depends)
    "B024", # abstract base class without abstract methods
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
asyncio_mode = "auto"
testpaths = [
    "src/tests",
]
pythonpath = [
    ".",
]
