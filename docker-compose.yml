services:

  backend:
    build: .
    container_name: genstory_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://genstory:password@db:5432/genstory_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000


  db:
    image: postgres:15-alpine
    container_name: genstory_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genstory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-genstory_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  adminer:
    image: adminer:latest
    container_name: genstory_adminer
    ports:
      - "8081:8080"
    depends_on:
      - db


  redis:
    image: redis:7-alpine
    container_name: genstory_redis
    ports:
      - "6379:6379"

  test:
    build: .
    container_name: genstory_test
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://genstory:password@db:5432/genstory_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: pytest src/tests


  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: genstory_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana-oss:10.0.0
    container_name: genstory_grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
