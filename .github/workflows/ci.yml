name: GenStory CI Pipeline

# 1. Triggers: Cấu hình điều kiện kích hoạt pipeline
on:
  push:
    branches: [ main, master ] # Kích hoạt khi có code mới push lên main hoặc master
  pull_request:
    branches: [ main, master ] # Kích hoạt khi có Pull Request trỏ vào main hoặc master

jobs:
  # Job 1: Chạy kiểm thử tự động (Unit Tests)
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest # Chạy trên máy ảo Ubuntu do GitHub cung cấp miễn phí

    steps:
      # Bước 1: Pull mã nguồn từ GitHub vào máy ảo CI
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Phiên bản Python tương thích với dự án

      # Bước 3: Cache các thư viện đã tải về để tăng tốc độ chạy CI ở những lần sau
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Bước 4: Cài đặt các dependencies cần thiết từ requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Bước 5: Chạy các bài test bằng pytest
      - name: Run tests with pytest
        env:
          PYTHONPATH: . # Thiết lập đường dẫn import để python nhận biết được thư mục src
        run: |
          pytest

  # Job 2: Kiểm tra build Docker image để đảm bảo không lỗi Dockerfile
  build-docker:
    name: Build & Verify Docker Image
    needs: test # Chỉ chạy job này nếu job 'test' ở trên thành công
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Pull mã nguồn vào máy ảo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Bước 2: Thiết lập Docker Buildx (công cụ build Docker hiện đại)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bước 3: Thử nghiệm build Docker image (chưa đẩy lên registry)
      - name: Build Docker Image (Verify Only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false # Đặt là false vì ta chỉ kiểm tra xem build có lỗi hay không
          tags: genstory-fastapi:latest
